; Envio de imagens pelo painel (26/10/2026): até 10 MB por foto (TratadorDeImagem::ENVIO_MAX_KB), com folga.
; O formulário do campeonato envia a logo e o banner juntos, por isso o post_max_size maior. O tratamento de uma
; foto grande de celular (12 MP) precisa de ~150 MB no GD. No servidor (Plesk) os três estão em 1024M.
upload_max_filesize = 12M
post_max_size = 30M
memory_limit = 256M
